<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>CampusFoodAgent · 多轮推荐助手</title>
<style>
:root{font-family:system-ui,sans-serif;color:#19392e;background:#f3f6f3}body{max-width:1000px;margin:auto;padding:24px}a{color:#205943}p{line-height:1.6}form,.panel,.restaurant{background:white;border:1px solid #d4e1d9;border-radius:12px;padding:18px;margin:16px 0}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}label{display:flex;flex-direction:column;gap:6px}input,select,button,textarea{font:inherit;border:1px solid #b3c9bd;border-radius:6px;padding:9px}button{cursor:pointer;background:#e8f1eb}button.primary{background:#205943;color:white}button:disabled{opacity:.5;cursor:wait}.options{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0}.options label{display:block}textarea{width:100%;box-sizing:border-box;min-height:78px}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;border-radius:10px;padding:12px;margin:10px 0;background:#edf4ef}.bubble.user{background:#d9e9de;margin-left:12%}.bubble.assistant{margin-right:8%}.muted{color:#587064;font-size:14px}#error{color:#962e27;white-space:pre-wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.quote{border-left:3px solid #a9c6b5;padding-left:12px}.actions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}.restaurant h3{margin-top:0}summary{cursor:pointer}
</style></head><body>
<h1>CampusFoodAgent · 多轮推荐助手</h1>
<p>依次试试：“找咖啡” → “再便宜一点” → “最好有户外座位” → “解释第二家” → “收藏它”。</p>
<p class="muted">本地演示身份没有登录认证。历史Yelp数据不能确认现在营业或饮食安全；相关评论不保证满足软偏好。会话保留24小时、最多30轮；默认本地规则编排。</p>
<p><a href="/demo">打开单次推荐实验室</a></p>
<form id="session-form"><div class="fields">
<label>演示用户ID（可选）<input id="user" maxlength="128" placeholder="填写后可跨会话查看收藏"></label>
<label>城市<input id="city" required value="Tampa" maxlength="80"></label>
<label>纬度<input id="lat" type="number" required min="-90" max="90" step="any" value="27.9506"></label>
<label>经度<input id="lon" type="number" required min="-180" max="180" step="any" value="-82.4572"></label>
<label>半径（公里）<input id="radius" type="number" required min="0.01" max="50" step="any" value="5"></label>
<label>最高价格等级<select id="price"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option></select></label>
</div><div class="actions"><button class="primary" id="start">开始新会话</button><button type="button" id="reset">清空本页并编辑位置</button></div></form>
<p id="error" role="alert"></p><p id="notice" role="status">请先开始会话。</p>
<section class="panel"><h2>对话</h2><div id="messages" aria-live="polite"></div>
<form id="turn-form"><label>输入请求<textarea id="message" maxlength="1000" required disabled placeholder="找附近的咖啡店"></textarea></label>
<div class="options"><label><input id="use-model" type="checkbox"> DeepSeek结构化动作规划（使用API额度）</label><label><input id="generate" type="checkbox"> 解释餐厅时用DeepSeek选择引用（使用API额度）</label></div>
<button id="send" class="primary" disabled>发送</button></form></section>
<section><h2>当前餐厅</h2><div id="results"></div></section>
<details class="panel" open><summary>当前生效条件</summary><pre id="state">尚未建立会话</pre></details>
<details class="panel"><summary>本轮工具执行轨迹</summary><pre id="trace">尚无执行</pre></details>
<script>
'use strict';
const el=id=>document.getElementById(id);
const node=(tag,text,css)=>{const value=document.createElement(tag);if(text!==undefined)value.textContent=String(text);if(css)value.className=css;return value;};
let session=null,pendingTurn=null,busy=false;
const storageKey='campusfood-agent-session-v1';
function remember(id){try{if(id)localStorage.setItem(storageKey,id);else localStorage.removeItem(storageKey);}catch(_){}}
async function api(path,payload){const response=await fetch(path,payload===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let data;try{data=await response.json();}catch(_){throw new Error('服务响应无法读取，请保留当前请求重试。');}if(!response.ok){const error=new Error('请求失败 ('+response.status+'): '+JSON.stringify(data.detail || data));error.status=response.status;throw error;}return data;}
function controls(){el('start').disabled=busy;el('reset').disabled=busy;el('send').disabled=busy || !session;el('message').disabled=!session;el('message').readOnly=busy || !!pendingTurn;el('send').textContent=pendingTurn?'重试本轮':'发送';for(const id of ['user','city','lat','lon','radius','price'])el(id).disabled=busy || !!session;el('use-model').disabled=busy || !!pendingTurn;el('generate').disabled=busy || !!pendingTurn;}
function bubble(role,text){el('messages').append(node('div',(role==='user'?'你：':'助手：')+text,'bubble '+role));}
function cards(rows,answer){el('results').replaceChildren();const used=new Map((answer && answer.citations || []).map(c=>[c.business_id+'|'+c.review_id+'|'+c.excerpt,c.id]));for(const [index,item] of (rows || []).entries()){const card=node('article',undefined,'restaurant');card.append(node('h3',(index+1)+'. '+item.name),node('p','价格等级 '+item.price_level+' · '+item.distance_km+' km · Yelp快照评分 '+item.rating,'muted'));const statuses={insufficient:'缺少相关评论证据',related_mentions:'有相关提及，需核对是否支持需求',mixed_cues:'存在混合或否定线索',not_requested:'未指定证据主题'};card.append(node('p',statuses[item.evidence_status] || item.evidence_status,'muted'));for(const evidence of item.evidence || []){const quote=node('blockquote',undefined,'quote');const id=used.get(item.business_id+'|'+evidence.document_id+'|'+evidence.excerpt);quote.append(node('p',evidence.excerpt || ''),node('small',(id?'['+id+'] 本轮说明已引用 · ':'')+evidence.document_id+' · '+(evidence.cue==='negative_cue'?'含否定线索，需核对语境':'相关提及')));card.append(quote);}el('results').append(card);}}
function applyContext(value){for(const [id,key] of [['user','user_id'],['city','city'],['lat','latitude'],['lon','longitude'],['radius','radius_km'],['price','max_price_level']])if(value[key]!==undefined)el(id).value=value[key]===null?'':String(value[key]);}
function displayState(value){el('state').textContent=JSON.stringify(value,null,2);}
function reset(){session=null;pendingTurn=null;remember(null);el('messages').replaceChildren();el('results').replaceChildren();el('message').value='';el('notice').textContent='请编辑位置，然后开始新会话。';displayState({});controls();}
el('reset').addEventListener('click',reset);
el('session-form').addEventListener('submit',async event=>{event.preventDefault();busy=true;el('error').textContent='';controls();try{session=await api('/api/v2/agent/sessions',{user_id:el('user').value.trim() || null,city:el('city').value,latitude:Number(el('lat').value),longitude:Number(el('lon').value),radius_km:Number(el('radius').value),max_price_level:Number(el('price').value),top_k:5});pendingTurn=null;remember(session.session_id);el('messages').replaceChildren();el('results').replaceChildren();displayState(session.state);el('notice').textContent='会话已创建，请输入第一条请求。';}catch(error){el('error').textContent=error.message;}finally{busy=false;controls();}});
el('turn-form').addEventListener('submit',async event=>{event.preventDefault();if(!session || busy)return;el('error').textContent='';if(!pendingTurn){pendingTurn={turn_id:crypto.randomUUID(),expected_version:session.version,message:el('message').value,use_model:el('use-model').checked,generate_answer:el('generate').checked};bubble('user',pendingTurn.message);}busy=true;controls();el('notice').textContent='正在执行…';try{const result=await api('/api/v2/agent/sessions/'+encodeURIComponent(session.session_id)+'/turns',pendingTurn);session.version=result.version;session.state=result.state;pendingTurn=null;bubble('assistant',result.message);cards(result.recommendations,result.answer);displayState(result.state);el('trace').textContent=JSON.stringify({action:result.action,status:result.status,planner:result.planner,budget:result.budget,trace:result.trace,events:result.events,favorites:result.favorites},null,2);el('message').value='';el('notice').textContent='第 '+result.version+' 轮 · '+result.status;}catch(error){el('error').textContent=error.message;el('notice').textContent='本轮结果未确认。点击重试会复用同一请求编号，避免重复写入。';if(error.status===404 || error.status===410){reset();}else if(error.status===409){try{const current=await api('/api/v2/agent/sessions/'+encodeURIComponent(session.session_id));session.version=current.version;session.state=current.state;pendingTurn=null;el('notice').textContent='会话版本已同步，请检查当前条件后重新发送。';displayState(current.state);cards(current.state.pending_clarification?[]:(current.state.last_response || {}).recommendations);}catch(syncError){el('error').textContent=syncError.message;}}}finally{busy=false;controls();}});
(async()=>{let id;try{id=localStorage.getItem(storageKey);}catch(_){}if(!id){controls();return;}try{session=await api('/api/v2/agent/sessions/'+encodeURIComponent(id));applyContext(session.state.context);for(const item of session.state.messages || [])bubble(item.role,item.text);cards(session.state.pending_clarification?[]:(session.state.last_response || {}).recommendations);displayState(session.state);el('notice').textContent='已恢复会话，第 '+session.version+' 轮。';}catch(_){remember(null);session=null;}controls();})();
</script></body></html>
