# Example to include inside nginx's `http {}` after replacing the domain and
# certificate paths. Keep Uvicorn bound to 127.0.0.1:8100 and one worker.
limit_req_zone $binary_remote_addr zone=campusfood_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=campusfood_api:10m rate=30r/m;

server {
    listen 80;
    server_name food.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name food.example.com;
    ssl_certificate /etc/ssl/campusfood/fullchain.pem;
    ssl_certificate_key /etc/ssl/campusfood/privkey.pem;
    client_max_body_size 16k;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;

    location = / { return 302 /app; }
    location = /app { proxy_pass http://127.0.0.1:8100; }
    location ^~ /app/ { proxy_pass http://127.0.0.1:8100; }
    location = /api/v2/product/register {
        limit_req zone=campusfood_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8100;
    }
    location = /api/v2/product/login {
        limit_req zone=campusfood_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8100;
    }
    location ^~ /api/v2/product/ {
        limit_req zone=campusfood_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8100;
    }
    location / { return 404; }
}
